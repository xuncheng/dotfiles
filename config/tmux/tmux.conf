#-------------------------------------------------------------------------------
#   TMUX CONFIG
#-------------------------------------------------------------------------------
# default-terminal is the TERM *inside* tmux; man tmux requires screen/tmux*
# Capabilities need no declaration: tmux reads Tc / Smulx / Setulc from the
# *outer* terminal's terminfo. Declaring them would tie this to one terminal
set -g default-terminal "tmux-256color"

#-------------------------------------------------------------------------------
#  Prefix {{{1
#-------------------------------------------------------------------------------
set-option -g prefix C-s
unbind-key C-b
bind-key C-s send-prefix

set-option  -g history-limit 100000
set-option  -g renumber-windows on
# Number windows from 1
set-option  -g base-index 1

# No delay after an escape
set -g escape-time 0

# Not #{config_files}: that is a comma-joined list of candidates, and
# source-file takes the whole string as one path and fails
bind r source-file $XDG_CONFIG_HOME/tmux/tmux.conf \; display "Reloaded!"

#unbind z # unbind default zoom
#bind Space resize-pane -Z
## }}}
