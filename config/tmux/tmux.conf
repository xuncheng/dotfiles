#-------------------------------------------------------------------------------
#   TMUX CONFIG
#-------------------------------------------------------------------------------
# default-terminal is the TERM *inside* tmux. man tmux requires it to be
# screen, tmux or a derivative — not the name of the outer terminal.
#
# True colour and curly underlines need no declaration here: tmux reads
# Tc / Smulx / Setulc from the *outer* terminal's terminfo and decides for
# itself (xterm-kitty carries all three). Hand-written terminal-features or
# terminal-overrides would tie this config to one terminal and be wrong the
# moment you switch terminals or ssh out — let tmux go by what the terminal
# actually reports.
set -g default-terminal "tmux-256color"

#-------------------------------------------------------------------------------
#  Prefix {{{1
#-------------------------------------------------------------------------------
set-option -g prefix C-s
unbind-key C-b
bind-key C-s send-prefix

set-option  -g history-limit 100000
set-option  -g renumber-windows on
set-option  -g base-index 1 # number windows from 1

set -g escape-time 0          # zero-out escape time delay

# Do not reach for #{config_files}: it is a comma-joined *list* of candidate
# paths, not the file that was loaded, and source-file takes the whole string
# as a single path and fails.
bind r source-file $XDG_CONFIG_HOME/tmux/tmux.conf \; display "Reloaded!"

#unbind z # unbind default zoom
#bind Space resize-pane -Z
## }}}
