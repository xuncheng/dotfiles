#-------------------------------------------------------------------------------
#  Navigation {{{1
#-------------------------------------------------------------------------------
set-option -g mouse on

#bind C-f command-prompt -p find-session 'switch-client -t %%' # find session
#bind-key C-j display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

bind '\' split-window -h -c '#{?pane_path,#{pane_path},#{pane_current_path}}'
bind - split-window -v -c '#{?pane_path,#{pane_path},#{pane_current_path}}'
#unbind '"'
#unbind %

unbind ^T
bind ^T split-window -l 30% -c '#{?pane_path,#{pane_path},#{pane_current_path}}'

# copy-mode uses vi keys
# v begins a selection and C-v toggles rectangle, as in Vim
setw -g mode-keys vi
bind Escape copy-mode
unbind-key -T copy-mode-vi Enter
bind-key -T copy-mode-vi v send-keys   -X begin-selection
bind-key -T copy-mode-vi c-v send-keys -X rectangle-toggle
# POSIX test, because if-shell runs under /bin/sh
# [[ ]] fails under dash, dropping silently into else — Linux would use pbcopy
if-shell '[ "$(uname -s)" = Linux ]' {
   bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
} {
   bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
}


## Synchronize all panes in a window
#bind y setw synchronize-panes
## easier and faster switching between next/prev window
#bind p previous-window
#bind n next-window

## detach client
#bind-key d detach
#bind-key C-d detach

## Cycle to next pane
#bind-key -r Tab select-pane -t :.+

## previous window
#bind-key BSpace previous-window

## swap panes
#bind-key -r J swap-pane -D
#bind-key -r K swap-pane -U

#unbind -T copy-mode-vi MouseDragEnd1Pane

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator

# Decide whether we are in a Vim process
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' { if -F '#{pane_at_left}' '' 'select-pane -L' }
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' { if -F '#{pane_at_top}' '' 'select-pane -U' }
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' { if -F '#{pane_at_right}' '' 'select-pane -R' }

bind-key -T copy-mode-vi 'C-h' if -F '#{pane_at_left}' '' 'select-pane -L'
bind-key -T copy-mode-vi 'C-j' if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key -T copy-mode-vi 'C-k' if -F '#{pane_at_top}' '' 'select-pane -U'
bind-key -T copy-mode-vi 'C-l' if -F '#{pane_at_right}' '' 'select-pane -R'

# C-l is taken by pane switching above, so clearing needs the prefix
bind C-l send-keys 'C-l'

# }}}
##-------------------------------------------------------------------------------
##  Status Bar {{{1
##-------------------------------------------------------------------------------
#bind-key b set-option status

# A user option, not a shell assignment — the latter leaks into every pane
# status-format reads these styles via #{E:...}, which expands #{@...}
set -g @inactive_fg '#5c6370'

set-option -g status on
set-option -g status-position top
set-option -g status-style fg=terminal,bg=terminal
set-option -g status-justify centre
set-option -g status-interval 5

set -g status-left-length  80
# Options -> ⧉ ❐
set -g status-left "#{?client_prefix,#[fg=#ffffff bg=#22252B],#[fg=#e5c07b,bold]} ❐ #S "
set -g status-right ""

#  #I - window index
#  #W - window title
#  #F - window flag
set-window-option -g window-status-style "fg=#{@inactive_fg}"
set-window-option -g window-status-current-style fg=white
set-window-option -g window-status-current-format " #I. #[bold,italics]#W"
set-window-option -g window-status-format " #I. #[italics]#W"
# Default is reverse
set-window-option -g window-status-activity-style none
set-window-option -g window-status-separator "#[fg=#{@inactive_fg}]"

# message-style          the command line
# message-command-style  command mode, i.e. vi or emacs mode on that line
# mode-style             the search indicator
set-option -g message-style fg=yellow,bg=terminal,bold
set-option -g message-command-style fg=green,bg=terminal,bold,blink
set-option -g mode-style bg=terminal,fg=brightgreen,bold
# }}}

#-------------------------------------------------------------------------------
#  Pane border {{{1
#-------------------------------------------------------------------------------
set-option        -g pane-active-border-style fg=colour51
set-option        -g pane-border-style        fg='#343d46'
# }}}

