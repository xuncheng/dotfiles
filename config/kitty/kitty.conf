# vim:fdm=marker:ft=kitty

#--------------------------------------------------------------------------------
# Keymaps to remember
#--------------------------------------------------------------------------------
# <Ctrl>-<Cmd>-, - reload config
#
# Tabs, panes and scrollback all belong to tmux. This file only covers what
# is kitty's alone: fonts, colours, cursor, the hints kitten, macOS behaviour.

#--------------------------------------------------------------------------------
# Fonts {{{
#--------------------------------------------------------------------------------
# Font family. You can also specify different fonts for the
# bold/italic/bold-italic variants.
#
# You can get a list of full family names available on your computer by running kitty list-fonts
font_family                     Cartograph CF Regular
italic_font                     Cartograph CF Light Italic
bold_font                       Cartograph CF Bold
bold_italic_font                Cartograph CF Bold Italic
font_size                       14
modify_font                     strikethrough_position 120%
modify_font                     strikethrough_thickness 250%
modify_font                     underline_position 125%
modify_font                     underline_thickness 3px
modify_font                     cell_height 120%
undercurl_style                 thin-dense

# kitty bundles a copy of Symbols Nerd Font Mono and falls back to it for
# glyphs it cannot find. Which font that fallback picks is not ours to decide,
# though: the font-symbols-only-nerd-font cask installs both the Mono and the
# non-Mono variant, and the non-Mono glyphs are not one cell wide, so anything
# that lands on them is misaligned.
# The Brewfile has a postinstall that deletes the non-Mono file; pinning the
# family here as the official FAQ suggests is a second, independent guard.
# The ranges come from what NF 3.5.1 actually covers, and are mostly the PUA
# blocks: symbols outside the PUA such as ♥ and ⏻ are deliberately left to the
# text font. The exception is U+276c-U+2771 (the ❮ ❯ family): the prompt uses ❯
# and Cartograph CF has no glyph for it, so without pinning it would fall back
# and could be taken by the non-Mono variant.
symbol_map U+276c-U+2771,U+e000-U+e00a,U+e0a0-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6bb,U+e700-U+e958,U+ea60-U+ec84,U+ed00-U+efcf,U+f000-U+f385,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

# No ligatures: != stays as ! and =, rather than fusing into one glyph.
# Cartograph CF draws ligatures from two OpenType features, calt and liga.
# disable_ligatures only covers calt; liga has to be switched off through
# font_features, addressed by PostScript name.
disable_ligatures               always
font_features CartographCF-Regular      -liga -calt
font_features CartographCF-Bold         -liga -calt
font_features CartographCF-LightItalic  -liga -calt
font_features CartographCF-BoldItalic   -liga -calt
#}}}
#--------------------------------------------------------------------------------
# Cursor customization {{{
#--------------------------------------------------------------------------------
cursor_blink_interval           0
pointer_shape_when_dragging     hand
#}}}
#--------------------------------------------------------------------------------
# Audio/visual bell {{{
#--------------------------------------------------------------------------------
bell_on_tab                     " "
enable_audio_bell               no
# Makes the dock icon bounce on macOS or the taskbar flash on linux.
window_alert_on_bell            yes
#}}}
#--------------------------------------------------------------------------------
# Window layout {{{
#--------------------------------------------------------------------------------
# remember_window_size matches the current default; spelled out so a change
# to kitty's defaults cannot move it. Note that --start-as=maximized in
# macos-launch-services-cmdline wins, so it has no effect when kitty is
# launched from the Dock or Finder.
# (The entries below are not defaults: placement_strategy defaults to center.)
remember_window_size            yes
window_border_width             1.0
window_margin_width             0.0
window_padding_width            0
placement_strategy              top-left
#}}}
#--------------------------------------------------------------------------------
# Tabs (disabled) {{{
#--------------------------------------------------------------------------------
# Tabs belong to tmux. The tab bar stays hidden so that a second tab, opened
# by accident, cannot stack a second bar on top of tmux's status line.
tab_bar_style                   hidden
#}}}
#--------------------------------------------------------------------------------
# Advanced {{{
#--------------------------------------------------------------------------------
# HACK: passing environment variables to GUI applications in macOS is very hard
# so this works around that by specifying the path to homebrew installations here
# this only provides the $PATH not all the missing environment variables.
# NOTE: this is why nvim must be started inside this file using zsh -c 'nvim'
env PATH=/opt/homebrew/bin/:/usr/local/bin/:${PATH}

# The shell program to execute. The default value of . means
# to use whatever shell is set as the default shell for the current user.
# Note that on macOS if you change this, you might need to add --login to
# ensure that the shell starts in interactive mode and reads its startup rc files.
shell                           .
# Kept fully off: nothing in this repo uses `kitty @`.
# Note that listen_on and --listen-on are silently ignored while this is no —
# the socket is never created — so macos-launch-services-cmdline should not
# carry --listen-on either.
allow_remote_control            no
#}}}
#--------------------------------------------------------------------------------
# Startup Session {{{
#--------------------------------------------------------------------------------
# FIXME: Ensure environment variables are set and accessible before using this
# startup_session                 $SYNC_DIR/kitty/startup.conf

#}}}
#--------------------------------------------------------------------------------
# Keyboard shortcuts {{{
#--------------------------------------------------------------------------------
# For a list of key names, see: http://www.glfw.org/docs/latest/group__keys.html
# For a list of modifier names, see: http://www.glfw.org/docs/latest/group__mods.html
kitty_mod                       ctrl+shift
# You can use the special action no_op to unmap a keyboard shortcut that is
# assigned in the default configuration.
#
# You can combine multiple actions to be triggered by a single shortcut, using the
# syntax below:
# map key combine <separator> action1 <separator> action2 <separator> action3 ...
# For example:
# map kitty_mod+e combine : new_window : next_layout
# this will create a new window and switch to the next available layout
#
# You can use multi-key shortcuts using the syntax shown below:
# map key1>key2>key3 action
# For example:
# map ctrl+f>2 set_font_size 20
# this will change the font size to 20 points when you press ctrl+f and then 2

# map cmd+left click to open URLs
mouse_map super+left            release grabbed,ungrabbed mouse_handle_click link
#}}}
#-------------------------------------------------------------------------------
# Tab management (disabled) {{{
#-------------------------------------------------------------------------------
# Tabs go to tmux entirely: unmap kitty's own new / next / move / rename tab
# bindings so a stray key cannot open a tab tmux knows nothing about.
# cmd+w and kitty_mod+q stay as a way out — with a single tab they close the
# window.
map cmd+t                       no_op
map kitty_mod+t                 no_op
map ctrl+tab                    no_op
map kitty_mod+tab               no_op
map kitty_mod+left              no_op
map kitty_mod+right             no_op
map cmd+shift+[                 no_op
map cmd+shift+]                 no_op
map kitty_mod+,                 no_op
map kitty_mod+.                 no_op
map cmd+shift+i                 no_op
map kitty_mod+alt+t             no_op

# Overlay nvim on the current window, opened on the dotfiles
map cmd+d                       launch --type=overlay --cwd=${HOME}/.dotfiles zsh -c 'nvim'
#}}}
#-------------------------------------------------------------------------------
# Window / pane management (disabled) {{{
#-------------------------------------------------------------------------------
# Same reasoning as tabs: panes belong to tmux. A kitty window (a split) is
# invisible to tmux, so the defaults for creating, switching, moving, resizing,
# jumping by index and cycling layouts are all unmapped.
# new_os_window (cmd+n / kitty_mod+n) stays — opening an OS window is kitty's
# job in the first place.
map cmd+enter                   no_op
map kitty_mod+enter             no_op
map cmd+shift+d                 no_op
map kitty_mod+w                 no_op
map kitty_mod+[                 no_op
map kitty_mod+]                 no_op
map kitty_mod+f                 no_op
map kitty_mod+b                 no_op
map kitty_mod+`                 no_op
map cmd+r                       no_op
map kitty_mod+r                 no_op
map kitty_mod+1                 no_op
map kitty_mod+2                 no_op
map kitty_mod+3                 no_op
map kitty_mod+4                 no_op
map kitty_mod+5                 no_op
map kitty_mod+6                 no_op
map kitty_mod+7                 no_op
map kitty_mod+8                 no_op
map kitty_mod+9                 no_op
map kitty_mod+0                 no_op
map kitty_mod+f7                no_op
map kitty_mod+f8                no_op
map kitty_mod+l                 no_op
#}}}
#-------------------------------------------------------------------------------
# Scrollback (disabled) {{{
#-------------------------------------------------------------------------------
# Scrollback belongs to tmux. tmux runs on the alternate screen, so kitty's
# own scrollback is essentially empty and these keys have nothing to show.
# Unmapped, they pass straight through to tmux.
map kitty_mod+up                no_op
map kitty_mod+down              no_op
map cmd+up                      no_op
map cmd+down                    no_op
map opt+cmd+page_up             no_op
map opt+cmd+page_down           no_op
map kitty_mod+page_up           no_op
map kitty_mod+page_down         no_op
map cmd+page_up                 no_op
map cmd+page_down               no_op
map kitty_mod+home              no_op
map kitty_mod+end               no_op
map cmd+home                    no_op
map cmd+end                     no_op
map kitty_mod+z                 no_op
map kitty_mod+x                 no_op
map kitty_mod+h                 no_op
#}}}
#-------------------------------------------------------------------------------
# Font sizes {{{
#-------------------------------------------------------------------------------
# These match kitty's current defaults; spelled out so a change to them
# cannot move these keys.
map cmd+equal                   increase_font_size
map cmd+minus                   decrease_font_size
map kitty_mod+equal             increase_font_size
map kitty_mod+minus             decrease_font_size
map kitty_mod+backspace         restore_font_size
#}}}
#-------------------------------------------------------------------------------
# Select and act on visible text {{{
#-------------------------------------------------------------------------------
# Use the hints kitten to select text and either pass it to an external program or
# insert it into the terminal or copy it to the clipboard.

# Open a currently visible URL using the keyboard. The program used to open the
# URL is specified in open_url_with.
# Same as the current default binding; spelled out so a change to kitty's
# defaults cannot move it.
map kitty_mod+e                 kitten hints

# Open a currently visible file name in nvim at a specific line.
# self opens in the current window: tabs and panes are tmux's, so kitty must
# not split on its own.
# (--linenum-action only accepts background/os_window/self/tab/window — there
# is no overlay.)
map kitty_mod+g kitten hints --type=linenum --linenum-action=self nvim +{line} {path}
# Select a path/filename and insert it into the terminal. Useful, for instance to
# run git commands on a filename output from a previous git command.
# map kitty_mod+p>f       kitten hints --type path --program -

# Select a path/filename and open it with the default open program.
# map kitty_mod+p>shift+f kitten hints --type path

# Select a line of text and insert it into the terminal. Use for the
# output of things like: ls -1
# map kitty_mod+p>l       kitten hints --type line --program -

# Select words and insert into terminal.
# map kitty_mod+p>w       kitten hints --type word --program -

# The hints kitten has many more modes of operation that you can map to different
# shortcuts. For a full description run: kitten hints --help
#}}}
#-------------------------------------------------------------------------------
# Miscellaneous {{{
#-------------------------------------------------------------------------------
# load_config_file, edit_config_file and input_unicode_character match the
# current default bindings; spelled out so a change to them cannot move these.
map cmd+ctrl+,                          load_config_file
map kitty_mod+\                         toggle_fullscreen
map kitty_mod+u                         input_unicode_character
map cmd+,                               edit_config_file
# By default kitty treats kitty_mod+a as the prefix of a set_background_opacity
# sequence (a>m / a>l / a>1 / a>d). One key cannot be both a prefix and a
# binding of its own without ambiguity, and with no background_opacity set
# those actions do nothing anyway, so they are unmapped.
map kitty_mod+a>m                       no_op
map kitty_mod+a>l                       no_op
map kitty_mod+a>1                       no_op
map kitty_mod+a>d                       no_op
# overlay rather than window: panes belong to tmux.
map kitty_mod+a                         kitty_shell overlay
map f1                                  show_kitty_env_vars

confirm_os_window_close                 2
#}}}
#-------------------------------------------------------------------------------
# OS specific tweaks {{{
#-------------------------------------------------------------------------------
draw_minimal_borders                    yes
hide_window_decorations                 yes
# Change the color of the kitty window's titlebar on macOS. A value of "system"
# means to use the default system color, a value of "background" means to use
# the background color of the currently active window and finally you can use
# an arbitrary color, such as #12af59 or "red".
macos_quit_when_last_window_closed      yes
# Use the option key as an alt key. With this set to no, kitty will use
# the macOS native Option+Key = unicode character behavior. This will
# break any Alt+key keyboard shortcuts in your terminal programs, but you
# can use the macOS unicode input technique.
macos_option_as_alt left
#}}}
#-------------------------------------------------------------------------------
# Includes {{{
#-------------------------------------------------------------------------------
# Machine-local overrides: drop a *.conf into kitty.d/, outside this repo.
# globinclude rather than include — an empty directory is skipped silently
# instead of reporting
# "Could not find included config file"。
globinclude kitty.d/**/*.conf
#}}}
#-------------------------------------------------------------------------------
# THEME
#-------------------------------------------------------------------------------
# BEGIN_KITTY_THEME
include ./themes/doom-one.conf
# END_KITTY_THEME
