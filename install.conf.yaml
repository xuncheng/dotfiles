- defaults:
    link:
      create: true
      relink: true

- create:
    - ~/.config
    # Claude Code keeps local state (sessions, projects, history) alongside its
    # settings, so the directory itself is not linked — only settings.json is.
    - ~/.claude

- clean: ["~", "~/.claude/rules"]

- shell:
    # The private submodule fails to clone without access; that is not an
    # error, just skip it
    - [git submodule update --init --recursive || true, Installing submodules]
    # By design Dropbox does not sync its own ignore rules, so every machine
    # needs a copy of its own. Distributed from here, in place at ./install
    # time, ahead of any yarn install.
    # It has to be a copy rather than a symlink: Dropbox does not honour the
    # symlinked form and uploads node_modules regardless.
    - ["[ -d ~/Dropbox ] && cp dropbox/rules.dropboxignore ~/Dropbox/rules.dropboxignore || true", Installing Dropbox ignore rules]

- link:
    # force: these paths often already exist as real files or directories,
    # created by another installer on a new machine or by hand. dotbot's
    # relink only replaces symlinks and aborts on a real file; force lets it
    # remove and recreate. These paths belong to the dotfiles anyway, so
    # overwriting is the intended behaviour.
    ~/.bin:
      force: true
      path: bin
    ~/.vim: vim
    ~/.npmrc: npm/npmrc
    # Any single `git config --global` turns this into a real file
    ~/.gitconfig:
      force: true
      path: git/.gitconfig
    ~/.githelpers: git/.githelpers
    ~/.gitignore_global: git/.gitignore_global
    ~/.gitmessage: git/.gitmessage
    ~/.zshenv: config/zsh/.zshenv
    ~/.claude/settings.json: claude/settings.json
    ~/.claude/rules/common: claude/rules
    # Private submodule: skipped on a machine without access rather than
    # failing the whole install
    ~/.claude/rules/private:
      if: "[ -e dotfiles-private/claude/rules ]"
      path: dotfiles-private/claude/rules
    ~/.config/zsh: config/zsh
    # LazyVim's starter is usually cloned straight into this path
    ~/.config/nvim:
      force: true
      path: config/nvim
    ~/.config/tmux: config/tmux
    ~/.config/kitty:
      force: true
      path: config/kitty
    ~/.config/vscode:
      force: true
      path: config/vscode
    ~/.Brewfile:
      if: "[ `uname` = Darwin ]"
      path: macos/Brewfile
