- defaults:
    link:
      create: true
      relink: true

- create:
    - ~/.config
    # Claude Code keeps local state (sessions, projects, history) alongside its
    # settings, so the directory itself is not linked — only settings.json is.
    - ~/.claude

- clean: ["~"]

- link:
    ~/.bin: bin
    ~/.vim: vim
    ~/.vimrc: vimrc
    ~/.npmrc: npmrc
    ~/.gitconfig: git/.gitconfig
    ~/.githelpers: git/.githelpers
    ~/.gitignore_global: git/.gitignore_global
    ~/.gitmessage: git/.gitmessage
    ~/.zshenv: config/zsh/.zshenv
    ~/.claude/settings.json: claude/settings.json
    ~/.claude/rules/common: claude/rules
    ~/.claude/rules/uchiwu: dotfiles-uchiwu/claude/rules
    ~/.config/zsh: config/zsh
    ~/.config/nvim: config/nvim
    ~/.config/tmux: config/tmux
    ~/.config/kitty:
      force: true
      path: config/kitty
    ~/.config/vscode:
      force: true
      path: config/vscode
    ~/.Brewfile:
      if: "[ `uname` = Darwin ]"
      path: macos/Brewfile

- shell:
    - [git submodule update --init --recursive, Installing submodules]
