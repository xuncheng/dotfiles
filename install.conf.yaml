- defaults:
    link:
      create: true
      relink: true

- create:
    - ~/.config
    # Only settings.json is linked: ~/.claude also holds local state
    - ~/.claude
    # Link individual Codex files; credentials and state stay local.
    - ~/.codex
    # Link individual Antigravity files; credentials, sessions and state stay local.
    - ~/.gemini/config
    - ~/.gemini/antigravity-cli

- clean: ["~", "~/.config", "~/.claude/rules", "~/.codex/rules", "~/.gemini/config", "~/.gemini/config/hooks", "~/.gemini/antigravity-cli"]

- shell:
    # Without access the private submodule is skipped, not an error.
    # GIT_TERMINAL_PROMPT=0 is what makes that a failure rather than a
    # credential prompt that hangs the install
    - [GIT_TERMINAL_PROMPT=0 git submodule update --init --recursive || true, Installing submodules]
    # Dropbox's own ignore rules
    # Not synced by Dropbox, so every machine needs its own copy
    # Must be a copy, not a symlink: Dropbox ignores the symlinked form
    - ["[ -d ~/Dropbox ] && cp dropbox/rules.dropboxignore ~/Dropbox/rules.dropboxignore || true", Installing Dropbox ignore rules]
    # Antigravity CLI rewrites settings.json atomically and stores machine-local
    # keys (trustedWorkspaces, model), so merge managed keys instead of symlinking.
    - [python3 agy/merge-settings.py agy/settings.json ~/.gemini/antigravity-cli/settings.json, Merging Antigravity CLI settings]

- link:
    # force is needed: these often exist as real files already, and relink
    # aborts on those rather than replacing them
    ~/.bin:
      force: true
      path: bin
    ~/.vim: vim
    ~/.npmrc: npm/npmrc
    # Any single `git config --global` turns this into a real file
    ~/.gitconfig:
      force: true
      path: git/.gitconfig
    ~/.githelpers: git/.githelpers
    ~/.gitignore_global: git/.gitignore_global
    ~/.gitmessage: git/.gitmessage
    ~/.zshenv: config/zsh/.zshenv
    ~/.claude/settings.json: claude/settings.json
    ~/.claude/statusline.sh: claude/statusline.sh
    ~/.claude/rules/common: claude/rules
    ~/.codex/AGENTS.md: agents/AGENTS.md
    ~/.codex/config.toml: codex/config.toml
    ~/.codex/rules/common.rules: codex/rules/common.rules
    ~/.gemini/config/AGENTS.md: agents/AGENTS.md
    ~/.gemini/config/hooks.json: agy/hooks.json
    ~/.gemini/config/hooks/block-sensitive-files.py: agy/hooks/block-sensitive-files.py
    ~/.gemini/antigravity-cli/statusline.sh: agy/statusline.sh
    ~/.gemini/antigravity-cli/title.sh: agy/title.sh
    ~/.config/zsh: config/zsh
    # LazyVim's starter is usually cloned straight into this path
    ~/.config/nvim:
      force: true
      path: config/nvim
    ~/.config/tmux: config/tmux
    ~/.config/kitty:
      force: true
      path: config/kitty
    ~/.config/vscode:
      force: true
      path: config/vscode
    ~/.Brewfile:
      if: "[ `uname` = Darwin ]"
      path: macos/Brewfile
